version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reportxpert_backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_API_BASE=http://ollama:11434
      - SUPERVISOR_MODEL=${SUPERVISOR_MODEL:-llama3.2:3b}
      - AUDITOR_MODEL=${AUDITOR_MODEL:-llama3.2:3b}
      - VISION_MODEL=${VISION_MODEL:-qwen2.5-vl:7b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}
    volumes:
      - ./backend/data:/app/data
      - ./models:/app/models
    depends_on:
      - ollama
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reportxpert_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: reportxpert_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
